<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Reserva tu cita</title>
</head>
<body>
    <main id="app">
    <h1 id="salon-name">Peluquería</h1>
    <p class="sub">Reserva tu cita en un minuto</p>

    <!-- Paso 1: Datos de contacto y servicio -->
    <section id="step-1" class="card">
        <label for="client-name">Nombre</label>
        <input id="client-name" autocomplete="name" placeholder="Tu nombre">

        <label for="client-phone">Teléfono</label>
        <input id="client-phone" type="tel" autocomplete="tel" placeholder="Ej: 600123456">

        <label for="client-svc">Servicio</label>
        <select id="client-svc"></select>

        <button id="btn-to-step-2" class="p" disabled>Ver días y horas</button>
    </section>

    <!-- Paso 2: Selección de día y bloque horario -->
    <section id="step-2" class="card" style="display:none;">
        <div id="step-summary" class="mut"></div>

        <h2>Elige día</h2>
        <div id="days-container" class="days"></div>

        <h2>Elige hora</h2>
        <div id="times-container" class="times"></div>

        <label for="client-note">Nota (opcional)</label>
        <textarea id="client-note" rows="2" maxlength="300" placeholder="Ej: preferencia de tono o indicaciones"></textarea>

        <p id="booking-err" class="err"></p>
        <button id="btn-confirm-booking" class="p" disabled>Confirmar cita</button>
        <button id="btn-back-step-1" style="width:100%;margin-top:8px">← Cambiar mis datos</button>
    </section>

    <!-- Paso 3: Confirmación de reserva -->
    <section id="step-done" class="card" style="display:none;">
        <p class="ok">¡Cita reservada!</p>
        <p id="done-details"></p>
        <p class="mut" style="margin-top:8px;">Tu cita ya ha quedado registrada en la agenda.</p>
        <a id="btn-wa-notify" class="wa" target="_blank" rel="noopener">Avisar por WhatsApp (opcional)</a>
        <button id="btn-book-again" class="p">Reservar otra cita</button>
    </section>

    <p class="mut" style="text-align:center;margin-top:24px">
    <a id="link-admin" href="views/login.html" style="color:var(--mut)">Acceso administradora</a>
    </p>
    </main>

        <script type="module" src="js/reserva.js"></script>
</body>
</html>
