<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../style.css">
    <title>Acceso Administradora</title>
</head>
<body>
    <main id="app">
        <h1>Administración</h1>
        <p class="sub">Acceso restringido</p>

        <div class="card">
            <label for="em">Email</label>
            <input id="em" type="email" autocomplete="username" placeholder="ejemplo@correo.com">
            
            <label for="pw">Contraseña</label>
            <input id="pw" type="password" autocomplete="current-password" placeholder="Tu contraseña">
            
            <p id="err" class="err"></p>
            <button id="btn-login" class="p">Entrar</button>
        </div>

        <p class="mut" style="text-align:center;margin-top:24px">
        <a href="../index.html" style="color:var(--mut)">← Volver a reservar cita</a>
        </p>
    </main>

    <script type="module" src="../js/login.js"></script>
</body>
</html>
